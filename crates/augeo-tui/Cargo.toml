[package]
name = "augeo-tui"
description = "The terminal interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
augeo-bench = { path = "../augeo-bench" }
augeo-catalog = { path = "../augeo-catalog" }
augeo-command = { path = "../augeo-command" }
augeo-engine = { path = "../augeo-engine" }
augeo-journal = { path = "../augeo-journal" }
augeo-ports = { path = "../augeo-ports" }
crossterm = "0.29"
# The line-info feature counts wrapped lines, which is how scrolling knows where the text ends.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }

[dev-dependencies]
augeo-fakes = { path = "../augeo-fakes" }
