[package]
name = "augeo-sys"
description = "Windows implementations of the ports. The only crate allowed to use unsafe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Tests that need an elevated process. GitHub's Windows runners are elevated, so CI turns this on.
admin-tests = []
# Tests that need a real NVIDIA GPU. CI has none, so these run on a developer's machine.
gpu-tests = []

[dependencies]
augeo-ports = { path = "../augeo-ports" }
sha2 = "0.11.1"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Restore",
    "Win32_System_Rpc",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
