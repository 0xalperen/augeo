[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Everything here must be compatible with distributing augeo under GPL-3.0.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# augeo makes no network calls. These are banned so one can't arrive through a dependency.
deny = [
    { crate = "curl" },
    { crate = "h2" },
    { crate = "hyper" },
    { crate = "isahc" },
    { crate = "native-tls" },
    { crate = "reqwest" },
    { crate = "rustls" },
    { crate = "surf" },
    { crate = "ureq" },
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
