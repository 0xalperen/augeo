<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="augeo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d2945"/>
      <stop offset="1" stop-color="#14121f"/>
    </linearGradient>
    <linearGradient id="rise" gradientUnits="userSpaceOnUse" x1="200" y1="820" x2="760" y2="180">
      <stop offset="0" stop-color="#c4a7e7"/>
      <stop offset="0.55" stop-color="#eb6f92"/>
      <stop offset="1" stop-color="#f6c177"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <!-- A level base for both chevrons. -->
    <clipPath id="base">
      <rect x="0" y="0" width="1024" height="808"/>
    </clipPath>
  </defs>
  <rect x="24" y="24" width="976" height="976" rx="216" fill="url(#tile)"/>
  <rect x="26" y="26" width="972" height="972" rx="214" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <g fill="none" stroke="url(#rise)" stroke-linejoin="miter" stroke-miterlimit="10">
    <g filter="url(#glow)" opacity="0.45">
      <path d="M216 800 L512 232 L808 800" stroke-width="128"/>
    </g>
    <g clip-path="url(#base)">
      <path d="M154 920 L512 232 L870 920" stroke-width="128"/>
      <path d="M334 920 L512 578 L690 920" stroke-width="96"/>
    </g>
  </g>
</svg>
