<!doctype html>
<meta charset="utf-8">
<title>augeo banner source</title>
<style>
  html, body { margin: 0; background: transparent; }
  .banner {
    width: 1600px; height: 480px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; gap: 64px;
    border-radius: 48px;
    background: radial-gradient(1000px 500px at 22% 40%, #2d2945 0%, #191724 62%, #14121f 100%);
  }
  img { width: 264px; height: 264px; }
  h1 {
    display: inline-block;
    margin: 0; font: 700 148px/1.3 "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -3px;
    background: linear-gradient(100deg, #c4a7e7 0%, #eb6f92 55%, #f6c177 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { margin: 10px 0 0; font: 400 34px/1.3 "Segoe UI Variable Text", "Segoe UI", sans-serif; color: #e0def4; }
  small { display: block; font-size: 25px; color: #908caa; margin-top: 8px; }
</style>
<div class="banner">
  <img src="logo.svg" alt="">
  <div>
    <h1>augeo</h1>
    <p>Measurable gaming performance on Windows and NVIDIA.<small>Every change is shown first, and can be undone.</small></p>
  </div>
</div>
