[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
repository = "https://github.com/0xalperen/augeo"
publish = false

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# A panic must restore the console and stop; it must never unwind through a half-finished apply.
panic = "abort"
strip = "debuginfo"
