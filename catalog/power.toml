[[tweak]]
id = "power-pcie-aspm-off"
component = "power"
number = 4
title = "PCIe link power saving off"
summary = """
Stops PCIe links dropping to a low-power state, which takes time to wake from. PC-Tuning disables \
it, but without numbers, so treat this as an experiment. The BIOS may have its own setting too. \
Applies to the current power plan, when plugged in.\
"""
danger = 1
evidence = "Experimental"
effect = "now"
risks = ["More power use at idle."]
undo_note = "Restores the previous value on the same power plan."

[tweak.applicability]
chassis = "desktop"

[[tweak.sources]]
url = "https://learn.microsoft.com/en-us/windows-hardware/customize/power-settings/pci-express-settings-link-state-power-management"
retrieved = "2026-11-04"
claim = "Documents the setting and its values."

[[tweak.sources]]
url = "https://github.com/valleyofdoom/PC-Tuning"
retrieved = "2026-11-04"
claim = "Disables it, without numbers."

