# Component: cpu. Numbers are permanent. See crates/augeo-catalog/src/schema.rs for the format.

[[tweak]]
id = "cpu-debug-timer-overrides"
component = "cpu"
number = 1
title = "Remove debug-only boot timer overrides"
summary = """
Old tweak guides often set these boot options. Microsoft documents them as for debugging only, and \
forcing the platform clock moves the performance counter away from the faster TSC. This repair \
removes any that are set, and does nothing if none are.\
"""
kind = "repair"
danger = 2
evidence = "Documented"
effect = "restart"
risks = [
    "Changes boot configuration, and needs a restart to take effect.",
    "Boot configuration changes can prompt for a BitLocker recovery key on an encrypted drive. Have your key available.",
]
undo_note = "Sets each removed boot option back to its previous value. Takes effect after a restart."

[[tweak.sources]]
url = "https://learn.microsoft.com/en-us/windows-hardware/drivers/devtest/bcdedit--set"
retrieved = "2026-11-04"
claim = "These options should only be used for debugging, and need a restart."

[[tweak.sources]]
url = "https://raw.githubusercontent.com/djdallmann/GamingPCSetup/master/CONTENT/RESEARCH/WINKERNEL/README.md"
retrieved = "2026-11-04"
claim = "useplatformclock moves the performance counter off TSC; tscsyncpolicy showed no notable effect."

[[tweak.rev]]
rev = 1

[[tweak.rev.resource]]
kind = "bcd_element"
element = "useplatformclock"

[[tweak.rev.resource]]
kind = "bcd_element"
element = "useplatformtick"

[[tweak.rev.resource]]
kind = "bcd_element"
element = "disabledynamictick"

[[tweak.rev.resource]]
kind = "bcd_element"
element = "tscsyncpolicy"

[[tweak]]
id = "cpu-global-timer-requests"
component = "cpu"
number = 2
title = "Let timer requests apply system-wide"
summary = """
Since Windows 10 2004, a program's timer request only affects that program. This value brings back \
the system-wide behaviour on Windows 11. On its own it does nothing: a program still has to request \
a higher resolution, such as augeo's timer tool. It has measured benefits for sleep precision, but \
no measured gaming latency benefit, and its name comes from community research, not Microsoft.\
"""
danger = 2
evidence = "Experimental"
effect = "restart"
risks = [
    "Microsoft warns that high timer resolution costs power and can hurt overall performance.",
    "Undocumented: a Windows update could change or remove it.",
    "Windows 11 doesn't guarantee high resolution for minimized or hidden windows.",
]
undo_note = "Restores the previous value, or removes it if it didn't exist. Takes effect after a restart."

[tweak.applicability]
build = ">=22000"

[[tweak.sources]]
url = "https://github.com/valleyofdoom/TimerResolution"
retrieved = "2026-11-05"
claim = "Describes GlobalTimerResolutionRequests, noted there as for debugging."

[[tweak.sources]]
url = "https://learn.microsoft.com/en-us/windows/win32/api/timeapi/nf-timeapi-timebeginperiod"
retrieved = "2026-11-04"
claim = "Timer requests have been per-process since Windows 10 2004, and raising resolution has a cost."

[[tweak.rev]]
rev = 1

[[tweak.rev.resource]]
kind = "reg_value"
scope = "machine"
path = 'SYSTEM\CurrentControlSet\Control\Session Manager\kernel'
name = "GlobalTimerResolutionRequests"
type = "dword"
desired = 1
