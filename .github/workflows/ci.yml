name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The numbering check compares the catalog lock against earlier commits and tags.
          fetch-depth: 0

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
        shell: bash

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Failures also go out as annotations, which can be read without signing in.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee test-output.txt || {
            grep -E "panicked at|^test .*FAILED|^error" test-output.txt | head -20 | sed 's/^/::error::/'
            exit 1
          }

      - name: Tests that need elevation (the runner is elevated)
        shell: bash
        run: |
          set -o pipefail
          cargo test -p augeo-sys --features admin-tests --locked 2>&1 | tee test-output.txt || {
            grep -E -A2 "panicked at|^test .*FAILED|^error" test-output.txt | head -30 | sed 's/^/::error::/'
            exit 1
          }

      - name: Stable tweak numbering
        run: cargo xtask check-numbering

      - name: Unsafe stays in one crate
        run: cargo xtask check-boundaries

      - name: NVAPI layouts match NVIDIA's headers
        shell: bash
        run: |
          git clone --quiet https://github.com/NVIDIA/nvapi.git "$RUNNER_TEMP/nvapi"
          git -C "$RUNNER_TEMP/nvapi" checkout --quiet 70d337db9186e968eab622f7e786de7e437faf3d
          cargo xtask check-nvapi-layout "$RUNNER_TEMP/nvapi"

      - name: Licenses and banned crates
        run: cargo deny check licenses bans sources

      - name: Security advisories
        run: cargo audit

      - name: Release build
        run: cargo build --release --locked -p augeo

      - name: No network DLLs, and protected against DLL planting
        run: cargo xtask check-binary target/release/augeo.exe

      - uses: actions/upload-artifact@v4
        with:
          name: augeo-dev-${{ github.sha }}
          path: target/release/augeo.exe
          if-no-files-found: error
          retention-days: 14
